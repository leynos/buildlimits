# Scan the checkout so scripts and Python action implementations cannot fall
# outside the gate. Runtime entry points remain distinct from exceptions.
[tool.df12_skylos]
roots = ["."]
python = "3.14"

[tool.skylos]
exclude = [".venv", ".uv-cache", ".uv-tools", ".tools", ".git"]

[tool.skylos.gate]
strict = true

# The supervisor reaches these members through typed collaborators and
# dataclass-held owners, which a static call graph cannot resolve. Entry-point
# rules do not rescue private callees, so each verified callee is named too.
[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "buildlimits.cache_recovery.CacheRecovery.tick",
    "buildlimits.cache_recovery.CacheRecovery.request_stop",
    "buildlimits.cache_recovery.CacheRecovery._starved",
    "buildlimits.cache_recovery.CacheRecovery._step",
    "buildlimits.cache_recovery.CacheRecovery._write_barrier",
    "buildlimits.cache_recovery.CacheRecovery._try_stop",
    "buildlimits.cache_recovery.CacheRecovery._account",
    "buildlimits.cache_recovery.CacheRecovery._try_start",
]
path = ["buildlimits/cache_recovery.py"]
reason = "supervisor_polling._poll_server calls supervisor.recovery.tick on every server poll, after the drain probe, and tick dispatches _starved and _step; _step invokes the phase actions; _try_stop calls request_stop to retain bounded queued-job progress. Recovery transaction, queued-request and cancellation regressions exercise this path. Skylos resolves neither the dataclass-held CacheRecovery reached through Supervisor.recovery nor the private callees of an unresolved dispatch."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_barrier.RecoveryBarrier.write"]
path = ["buildlimits/recovery_barrier.py"]
reason = "CacheRecovery._write_barrier writes the restart barrier through the RecoveryBarrier the transaction holds; it is a callee of the declared recovery dispatch above."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_roots.VisibleRootsGrace.reset"]
path = ["buildlimits/recovery_roots.py"]
reason = "CacheRecovery._try_stop, _begin and _finish break the grace clock through the VisibleRootsGrace the transaction holds in its _roots_grace field; they are callees of the declared recovery dispatch above, and the roots-deadline tests exercise each reset."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_starvation.RetainedDrainAge.observe"]
path = ["buildlimits/recovery_starvation.py"]
reason = "CacheRecovery._starved measures the retained drain's age through the RetainedDrainAge the transaction holds in its _drain_age field; it is a callee of the declared recovery dispatch above, and the doctest and stale-drain tests exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "buildlimits.launch.HeldChild.reap",
    "buildlimits.groups.Groups.abandon_held",
    "buildlimits.groups.Groups.cache_notice",
    "buildlimits.sccache.ManagedSccache.stop",
    "buildlimits.systemd.UserManager.control_unit",
]
reason = "Supervisor placement dispatches abandon_held and cache_notice on the Groups instance held by Supervisor.groups; test_unreleased_disconnect.py exercises the acknowledgement-failure path. The supervisor also reaches HeldChild, ManagedSccache and CacheRecovery through typed collaborators a static call graph cannot resolve. CacheRecovery selects its control verb dynamically, so no call edge reaches the queued-unit-job method the user manager exposes."



[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.admission_state.Gauges.counts"]
path = ["buildlimits/admission_state.py"]
reason = "Admission inherits its gauge accessors from Gauges, and every caller reads them as Admission.counts through a typed collaborator, which Skylos resolves only on the class that defines a method. The status document, the recovery machine and the requester metrics all call it; tests/test_admission.py exercises it."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = ["buildlimits.admission_state.snapshot"]
path = ["buildlimits/admission_state.py"]
reason = "Gauges.counts, the declared entry point above, builds every snapshot through it; the doctest and test_admission.py exercise it."

[tool.nose]
version = "0.20.0"
roots = ["."]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 0
exclude = [".venv/**", ".uv-cache/**", ".uv-tools/**", ".tools/**", ".git/**"]

# Skylos treats test-classified paths as entry points, so Vulture supplies
# dead-helper detection there. Names collected by pytest are entry points;
# their function bodies and all other definitions remain checked.
[tool.vulture]
# The remaining names are read outside the scanned test tree: production code
# reads the attributes tests set on real objects, mocks read their configured
# results, callers dispatch ``__call__`` on runner doubles, and CrossHair
# loads its contracts by name, and pytest runs the autouse leak guard without
# any test naming it.
ignore_names = [
    "test_*",
    "pytestmark",
    "pytest_plugins",
    # pytest calls this hook by name during collection; no test names it.
    "pytest_collection_modifyitems",
    "teardown",
    "descriptor_leak_guard",
    "__call__",
    "return_value",
    "side_effect",
    "_next_cache_poll",
    "_next_drain",
    "_next_server_poll",
    "ahead",
    "baseline_known",
    "busy_retries",
    "restart_retries",
    "high_water",
    "next_due",
    "slice_dir",
    "limit_order_is_total",
    "planned_limits_are_reachable",
    # The recovery search's Events counters are read by name through EVENTS
    # and getattr in test_cache_recovery_properties, never as attributes.
    "opened_stale",
    "stopped_on_deadline",
]
# pytest-bdd steps and Hypothesis state-machine rules are registered by their
# decorators and dispatched by the framework, never called by name.
ignore_decorators = [
    "@given",
    "@when",
    "@then",
    "@rule",
    "@invariant",
    "@precondition",
]
min_confidence = 60

[tool.mutmut]
# mutmut copies the tree before running the suite: tests that read
# repository-root paths outside tests/ must either add those paths to
# `also_copy` or guard themselves with a skipif. See the shared-actions
# caller guide (docs/mutation-mutmut-workflow.md).
source_paths = ["buildlimits/"]
also_copy = ["scripts/", ".github/", "Makefile", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
# Module doctests are part of the contract, so collection covers the package
# as well as the test tree. ``modelcheck`` is a top-level package outside the
# wheel (ADR 004), so it is collected here too.
testpaths = ["tests", "buildlimits", "modelcheck"]
# ``descriptor_guard`` is a plugin, not a conftest fixture, so its autouse leak
# guard also covers the package's doctests (see tests/descriptor_guard.py).
# The repository root is on the path because ``modelcheck`` is not installed:
# only ``buildlimits`` is, through the editable install.
pythonpath = ["tests", "."]
addopts = ["--doctest-modules", "-p", "descriptor_guard"]
# A descriptor-owning object that is dropped unclosed is a test defect, not
# noise: the collector closes it during some later test, whose descriptor
# accounting then fails. tests/descriptor_guard.py catches the objects a
# reference cycle keeps alive; these filters catch the rest as they are freed.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "systemd_user: needs a running systemd user manager and busctl",
    "fizzbee: runs the pinned FizzBee checker; opt in with BUILD_LIMITS_MODEL_CHECK=1",
]

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildlimits"]

# Reasoned exceptions to the shared duplication gate. Each entry names every
# location of one family, so a further copy still blocks.

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/requesters.py",
    "tests/test_request_validation.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/admission.py",
    "buildlimits/effect_dispatch.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/attributes.py",
    "buildlimits/launch_setup.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/adapter.py",
    "tests/test_cache_recovery_transport.py",
    "buildlimits/status_client.py",
    "tests/test_supervisor_startup.py",
    "tests/test_queue_budget.py",
    "tests/test_request_pressure.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/requesters.py",
    "buildlimits/adapter.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "tests/test_supervisor_loop.py",
    "buildlimits/cache_recovery.py",
    "buildlimits/server_watch.py",
]
reason = "Matching import lists: each module names the protocol or port symbols it uses, and sharing them through a re-export module would hide each module's real dependencies."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/recover_cli.py::_summary",
    "buildlimits/recover_cli.py::_report",
]
reason = "The text summary and the report dispatcher read the same document keys for different outputs; the detector matches their shared lookups, not shared logic."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/sccache.py::stop",
    "buildlimits/sccache.py::start",
]
reason = "stop and start are the public, documented verbs of the managed-cache port; each delegates to the shared private _control, so only their docstrings repeat."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/cache_recovery.py",
    "buildlimits/recovery_guidance.py",
    "buildlimits/supervisor.py",
]
reason = "Three unrelated operator log lines share only the log-call shape."

[[tool.duplication_gate.allow]]
members = [
    "tests/test_recovery_starvation.py::_permits_cooling",
    "buildlimits/recovery_starvation.py",
]
reason = "The test oracle restates the cooldown rule independently so that a change to the production rule is caught, not mirrored."

[[tool.duplication_gate.allow]]
members = [
    "buildlimits/supervisor.py",
    "tests/test_queue_budget.py",
]
reason = "The test calls the same private reply-flush method the supervisor loop calls; one statement is not duplicated logic."

[[tool.duplication_gate.allow]]
unit = "tests/test_cache_recovery_composition.py"
reason = "Counterpart scenarios: the same recovery transaction driven to different outcomes. Each test asserts a different contract with its own explanation, so the shared tick-and-assert shape is the specification, not copied logic."

[[tool.duplication_gate.allow]]
members = [
    "tests/test_cache_recovery.py::test_the_transaction_stops_accounts_and_restarts_the_managed_cache",
    "tests/test_cache_recovery.py::test_a_repeated_cancellation_cannot_lose_a_token_or_overflow_capacity",
]
reason = "Both scenarios drive one transaction through accounting and then assert different contracts (the full restart versus token conservation across a second drain); the shared arrange step is already the opened_recovery helper."

[[tool.duplication_gate.allow]]
members = [
    "tests/test_adapter_busy.py",
