[project]
name = "buildlimits"
version = "0.1.0"
description = "Machine-wide admission for concurrent Cargo compilation through guildmaster."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "ISC" }
# The supervisor traces placements; adapters load the SDK only after a restart.
dependencies = [
    "opentelemetry-sdk>=1.45.1,<2",
]

[project.scripts]
build-limits-rustc = "buildlimits.adapter:rustc_main"
build-limits-rustdoc = "buildlimits.adapter:rustdoc_main"
build-limits-supervisor = "buildlimits.service:main"
build-limits-status = "buildlimits.status_cli:main"
build-limits-recover = "buildlimits.recover_cli:main"
build-limits-metrics = "buildlimits.metrics_cli:main"
build-limits-cache-replay = "buildlimits.outcome_replay_cli:main"

[dependency-groups]
dev = [
    "pytest",
    "interrogate",
    "pip-audit",
    "ruff==0.16.8",
    "cyclopts==4.25.2",
    "pyyaml==6.0.3",
    "types-pyyaml",
    "pyright",
    "ty==0.0.89",
    "pytest-timeout",
    "pytest-xdist",
    "crosshair-tool>=0.0.80",
    "hypothesis>=6.0,<7",
    "pytest-bdd>=8.0,<9",
    "syrupy>=6.0,<7",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "ASYNC",
    "D",
    "DOC",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["non-empty-init-module"]
# Pytest modules are not reusable public APIs; reusable support modules remain
# subject to the DOC policy.
"**/test_*.py" = [
    "missing-type-function-argument",
    "undocumented-public-method",
    "undocumented-public-function",
    "docstring-missing-returns",
    "docstring-missing-yields",
    "docstring-missing-exception",
    "line-too-long",
    "boolean-type-hint-positional-argument",
    "boolean-positional-value-in-call",
    "manual-list-comprehension",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "no-self-use",
    "pytest-composite-assertion",
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    "multiple-with-statements",
    "typing-only-standard-library-import",
    "raise-vanilla-args",
]
"tests/steps/*.py" = [
    "assert",
    "too-many-arguments",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "no-self-use",
]
# pytest-bdd resolves step parameter annotations while it collects scenarios.
"tests/test_cache_outcomes_systemd.py" = ["typing-only-third-party-import"]
# CrossHair proves the ``assert`` statements in these contracts; they are the
# specification, not debugging aids.
"tests/crosshair_contracts.py" = ["assert"]
# The state machine is the specification of the recovery transaction's safety
# contract, and Hypothesis refuses to report a counterexample against a bare
# ``AssertionError``. Its ``assert`` statements are the contract and its guards
# carry the message a failing search is read from, so they are not debugging
# aids to be deleted under ``-O``.
"tests/cache_recovery_state_machine.py" = ["assert"]
# The acceptance harness and the fake sccache drive the user's own systemd
# tools and the vectors their tests supply, found on PATH as a build would.
"tests/systemd_harness.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path"]
"tests/fixtures/fake_sccache.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path"]
# The scenario world lives beside the test modules and drives the user's own
# systemd tools with fixed argv. Its guards state the fixture preconditions a
# scenario depends on, so they fail the scenario rather than debug it.
"tests/cache_recovery_systemd_world.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# Expected operator-facing lines are compared verbatim, so wrapping them would
# stop them matching the rendered summary they pin.
"tests/status_render_states.py" = ["line-too-long"]
[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.AbstractSet".msg = "Use collections.abc.Set instead of deprecated typing generics."
"typing.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead of deprecated typing generics."
"typing.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead of deprecated typing generics."
"typing.AsyncIterable".msg = "Use collections.abc.AsyncIterable instead of deprecated typing generics."
"typing.AsyncIterator".msg = "Use collections.abc.AsyncIterator instead of deprecated typing generics."
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead of deprecated typing generics."
"typing.Callable".msg = "Use collections.abc.Callable instead of deprecated typing generics."
"typing.ChainMap".msg = "Use collections.ChainMap instead of deprecated typing generics."
"typing.Collection".msg = "Use collections.abc.Collection instead of deprecated typing generics."
"typing.Container".msg = "Use collections.abc.Container instead of deprecated typing generics."
"typing.ContextManager".msg = "Use contextlib.AbstractContextManager instead of deprecated typing generics."
"typing.Coroutine".msg = "Use collections.abc.Coroutine instead of deprecated typing generics."
"typing.Counter".msg = "Use collections.Counter instead of deprecated typing generics."
"typing.DefaultDict".msg = "Use collections.defaultdict instead of deprecated typing generics."
"typing.Deque".msg = "Use collections.deque instead of deprecated typing generics."
"typing.Dict".msg = "Use dict instead of deprecated typing generics."
"typing.FrozenSet".msg = "Use frozenset instead of deprecated typing generics."
"typing.Generator".msg = "Use collections.abc.Generator instead of deprecated typing generics."
"typing.ItemsView".msg = "Use collections.abc.ItemsView instead of deprecated typing generics."
"typing.Iterable".msg = "Use collections.abc.Iterable instead of deprecated typing generics."
"typing.Iterator".msg = "Use collections.abc.Iterator instead of deprecated typing generics."
"typing.KeysView".msg = "Use collections.abc.KeysView instead of deprecated typing generics."
"typing.List".msg = "Use list instead of deprecated typing generics."
"typing.Mapping".msg = "Use collections.abc.Mapping instead of deprecated typing generics."
"typing.Match".msg = "Use re.Match instead of deprecated typing generics."
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead of deprecated typing generics."
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead of deprecated typing generics."
"typing.MutableSet".msg = "Use collections.abc.MutableSet instead of deprecated typing generics."
"typing.OrderedDict".msg = "Use collections.OrderedDict instead of deprecated typing generics."
"typing.Pattern".msg = "Use re.Pattern instead of deprecated typing generics."
"typing.Reversible".msg = "Use collections.abc.Reversible instead of deprecated typing generics."
"typing.Sequence".msg = "Use collections.abc.Sequence instead of deprecated typing generics."
"typing.Set".msg = "Use set instead of deprecated typing generics."
"typing.Tuple".msg = "Use tuple instead of deprecated typing generics."
"typing.Type".msg = "Use type instead of deprecated typing generics."
"typing.ValuesView".msg = "Use collections.abc.ValuesView instead of deprecated typing generics."

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pydoclint]
# Public one-line docstrings must still describe their returns and exceptions.
# Private-helper exceptions are declared at their individual definitions.
ignore-one-line-docstrings = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pylint.main]
py-version = "3.14"
recursive = true
max-module-lines = 400

[tool.pylint.design]
max-args = 4
max-locals = 20
max-statements = 70
max-positional-arguments = 4

[tool.pylint."messages control"]
disable = [
    "all",
]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

# Scan the checkout so scripts and Python action implementations cannot fall
# outside the gate. Runtime entry points remain distinct from exceptions.
[tool.df12_skylos]
roots = ["."]
python = "3.14"

[tool.skylos]
exclude = [".venv", ".uv-cache", ".uv-tools", ".tools", ".git"]

[tool.skylos.gate]
strict = true

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.outcome_window.OutcomeWindow.append"]
path = ["buildlimits/outcome_window.py"]
reason = "OutcomeRecorder._launch appends through Progress.window, a generic dataclass field that Skylos does not resolve; the bounded-window and recorder overflow tests exercise this method."

# These collaborator calls are live, but Skylos cannot resolve the stored
# supervisor, child-list, or report-union dispatch. Keep each allowance exact.
[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.groups.Groups.advance"]
path = ["buildlimits/groups.py"]
reason = "group_recovery.empty_groups calls supervisor.groups.advance to drain a group before removal; Supervisor._tick owns that typed collaborator, which Skylos does not resolve. The group-drain tests call advance directly."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.groups.Groups.remove"]
path = ["buildlimits/groups.py"]
reason = "group_recovery.empty_groups calls supervisor.groups.remove after advance confirms the group is empty; Supervisor._tick owns that typed collaborator. Recovery and graceful-restart systemd scenarios exercise the cleanup."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.nonblocking_child.NonBlockingChild.poll"]
path = ["buildlimits/nonblocking_child.py"]
reason = "ChildReaper.poll dispatches poll through each child in its owned list; Skylos does not resolve that collection dispatch. The nonblocking-child and stalled-query tests exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.nonblocking_child.NonBlockingChild._read_available"]
path = ["buildlimits/nonblocking_child.py"]
reason = "NonBlockingChild.poll drains its nonblocking pipe through this private helper; Skylos does not retain private callees through the child-list entry point. The nonblocking-child and stalled-query tests exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.outcome_replay.H2Report.as_dict"]
path = ["buildlimits/outcome_replay.py"]
reason = "outcome_replay_cli._write_report serializes this method through the H2/H3 report union; Skylos does not resolve the union dispatch. H2 replay and CLI tests exercise the JSON shape."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.outcome_replay.H3Report.as_dict"]
path = ["buildlimits/outcome_replay.py"]
reason = "outcome_replay_cli._write_report serializes this method through the H2/H3 report union; Skylos does not resolve the union dispatch. H3 replay and CLI tests exercise the JSON shape."

# The supervisor reaches these members through typed collaborators and
# dataclass-held owners, which a static call graph cannot resolve. Entry-point
# rules do not rescue private callees, so each verified callee is named too.
[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "buildlimits.cache_recovery.CacheRecovery.tick",
    "buildlimits.cache_recovery.CacheRecovery.request_stop",
    "buildlimits.cache_recovery.CacheRecovery._starved",
    "buildlimits.cache_recovery.CacheRecovery._step",
    "buildlimits.cache_recovery.CacheRecovery._write_barrier",
    "buildlimits.cache_recovery.CacheRecovery._try_stop",
    "buildlimits.cache_recovery.CacheRecovery._account",
    "buildlimits.cache_recovery.CacheRecovery._try_start",
    "buildlimits.cache_recovery.CacheRecovery.reclaim_after_accounting",
]
path = ["buildlimits/cache_recovery.py"]
reason = "supervisor_polling._poll_server calls supervisor.recovery.tick on every server poll, after the drain probe, and tick dispatches _starved and _step; _step invokes the phase actions; _try_stop calls request_stop to retain bounded queued-job progress. Supervisor.start calls reclaim_after_accounting once the drain slices are emptied, before the pool and listener exist. Recovery transaction, queued-request, cancellation and reclaim regressions exercise this path. Skylos resolves neither the dataclass-held CacheRecovery reached through Supervisor.recovery, including the recovery pair returned by supervisor_wiring.watch_and_recovery, nor the private callees of an unresolved dispatch."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_barrier.RecoveryBarrier.write"]
path = ["buildlimits/recovery_barrier.py"]
reason = "CacheRecovery._write_barrier writes the restart barrier through the RecoveryBarrier the transaction holds; it is a callee of the declared recovery dispatch above."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_roots.VisibleRootsGrace.reset"]
path = ["buildlimits/recovery_roots.py"]
reason = "CacheRecovery._try_stop, _begin and _finish break the grace clock through the VisibleRootsGrace the transaction holds in its _roots_grace field; they are callees of the declared recovery dispatch above, and the roots-deadline tests exercise each reset."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.recovery_starvation.RetainedDrainAge.observe"]
path = ["buildlimits/recovery_starvation.py"]
reason = "CacheRecovery._starved measures the retained drain's age through the RetainedDrainAge the transaction holds in its _drain_age field; it is a callee of the declared recovery dispatch above, and the doctest and stale-drain tests exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "buildlimits.launch.HeldChild.reap",
    "buildlimits.groups.Groups.abandon_held",
    "buildlimits.groups.Groups.cache_notice",
    "buildlimits.sccache.ManagedSccache.stop",
    "buildlimits.systemd.UserManager.control_unit",
]
reason = "Supervisor placement dispatches abandon_held and cache_notice on the Groups instance held by Supervisor.groups; test_unreleased_disconnect.py exercises the acknowledgement-failure path. The supervisor also reaches HeldChild, ManagedSccache and CacheRecovery through typed collaborators a static call graph cannot resolve. CacheRecovery selects its control verb dynamically, so no call edge reaches the queued-unit-job method the user manager exposes."



[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.admission_state.Gauges.counts"]
path = ["buildlimits/admission_state.py"]
reason = "Admission inherits its gauge accessors from Gauges, and every caller reads them as Admission.counts through a typed collaborator, which Skylos resolves only on the class that defines a method. The status document, the recovery machine and the requester metrics all call it; tests/test_admission.py exercises it."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = ["buildlimits.admission_state.snapshot"]
path = ["buildlimits/admission_state.py"]
reason = "Gauges.counts, the declared entry point above, builds every snapshot through it; the doctest and test_admission.py exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.journal_native.JournalSink.emit_trace"]
path = ["buildlimits/journal_native.py"]
reason = "The service composition root passes JournalSink to JournalTracer; JournalTracer._get_tracer supplies it to JournalSpanExporter, whose export method calls emit_trace through _TraceSinkPort. Skylos cannot resolve this cross-module protocol dispatch; tests/test_tracing.py and tests/test_supervisor_effects.py exercise it."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["buildlimits.tracing._OtelSpan.finish"]
path = ["buildlimits/tracing.py"]
reason = "AdmissionAttempt.finish_restart calls finish through its dataclass-held restart_span field; tests/test_adapter_restart_tracing.py exercises terminal span completion after admission and failure."

[tool.nose]
version = "0.20.0"
roots = ["."]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 0
exclude = [".venv/**", ".uv-cache/**", ".uv-tools/**", ".tools/**", ".git/**"]

# Skylos treats test-classified paths as entry points, so Vulture supplies
# dead-helper detection there. Names collected by pytest are entry points;
# their function bodies and all other definitions remain checked.
[tool.vulture]
# The remaining names are read outside the scanned test tree: production code
# reads the attributes tests set on real objects, mocks read their configured
# results, callers dispatch ``__call__`` on runner doubles, and CrossHair
# loads its contracts by name, and pytest runs the autouse leak guard without
# any test naming it.
ignore_names = [
    "test_*",
    "pytestmark",
    "pytest_plugins",
    "teardown",
    "descriptor_leak_guard",
    # Vulture cannot resolve quoted cast types imported only for type checks.
    "RecorderEvent",
    "OutcomeStorePort",
    "ServerProcessPort",
    # TypedDict fields are read via JSON-key subscripting in the fake servers.
    "script_index",
    "statistics_queries",
    # Production reads this field from Pending; test scenarios set it directly.
    "cache_path",
    "__call__",
    "return_value",
    "side_effect",
    "_next_cache_poll",
    "_next_drain",
    "_next_server_poll",
    "ahead",
    "baseline_known",
    "busy_retries",
    "restart_retries",
    "high_water",
    "next_due",
    "slice_dir",
    "limit_order_is_total",
    "planned_limits_are_reachable",
    "unanimous_hit_windows_keep_the_hit_label",
    "cache_errors_are_not_dropped_from_a_solo_footprint",
    "repeated_cache_errors_are_not_unanimous",
    "decoding_never_labels_mixed",
    # The recovery search's Events counters are read by name through EVENTS
    # and getattr in test_cache_recovery_properties, never as attributes.
    "opened_stale",
    "stopped_on_deadline",
]
# pytest-bdd steps and Hypothesis state-machine rules are registered by their
# decorators and dispatched by the framework, never called by name.
ignore_decorators = [
    "@given",
    "@when",
    "@then",
    "@rule",
    "@invariant",
    "@precondition",
]
min_confidence = 60

[tool.mutmut]
# mutmut copies the tree before running the suite: tests that read
# repository-root paths outside tests/ must either add those paths to
# `also_copy` or guard themselves with a skipif. See the shared-actions
# caller guide (docs/mutation-mutmut-workflow.md).
source_paths = ["buildlimits/"]
also_copy = ["scripts/", ".github/", "Makefile", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
# Module doctests are part of the contract, so collection covers the package
# as well as the test tree.
testpaths = ["tests", "buildlimits"]
# ``descriptor_guard`` is a plugin, not a conftest fixture, so its autouse leak
# guard also covers the package's doctests (see tests/descriptor_guard.py).
pythonpath = ["tests"]
addopts = ["--doctest-modules", "-p", "descriptor_guard"]
# A descriptor-owning object that is dropped unclosed is a test defect, not
# noise: the collector closes it during some later test, whose descriptor
# accounting then fails. tests/descriptor_guard.py catches the objects a
# reference cycle keeps alive; these filters catch the rest as they are freed.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "sccache_host_check: requires opt-in, Linux, and sccache 0.14.0",
    "systemd_user: needs a running systemd user manager and busctl",
]

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildlimits"]

