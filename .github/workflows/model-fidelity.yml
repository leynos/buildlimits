name: W1 model fidelity

# The pull-request half of the model obligation. It answers one question per
# change: do the W1 models still describe the production surface they claim to
# transcribe? That is a text-and-import comparison, so it costs seconds and can
# gate every pull request.
#
# It deliberately does not run the matrix. Exploring the state space takes
# about two minutes of CPU per half at the routine bounds, which is the wrong
# price for every push and the right one for a nightly run;
# `.github/workflows/model-check-nightly.yml` owns that half.
#
# The drift report is what fails here. A path added to `buildlimits/` with no
# `# maps:` annotation, a mapping whose target no longer resolves, an exclusion
# with no reason, and the two halves failing to cover the whole surface
# between them are all reported by `modelcheck drift` and by
# `tests/test_model_drift.py`. `make model-fidelity` runs both: the report so a
# failure is legible in the job log, the tests because they carry the union and
# reason checks the command cannot make.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check the models against the production surface
    runs-on: ubuntu-latest
    # The routine budget is 10 minutes for anything that is not the matrix
    # itself. A drift check that needs more is a hang, not a slow machine.
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check fidelity for both halves
        run: make model-fidelity
