name: Act Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  act-validation:
    runs-on: ubuntu-latest
    env:
      ACT_VERSION: v0.2.84
      MARKDOWNLINT_CLI2_VERSION: 0.22.1
      MBAKE_VERSION: 1.4.6
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Set up Go for Actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5


      - name: Install act
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          act_archive=act_Linux_x86_64.tar.gz
          act_url="https://github.com/nektos/act/releases/download/${ACT_VERSION}/${act_archive}"
          curl -fsSLo "${act_archive}" "${act_url}"
          act_sha256="$(
            curl -fsSL --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/nektos/act/releases/tags/${ACT_VERSION}" |
              jq -r --arg archive "${act_archive}" \
                '.assets[] | select(.name == $archive) | .digest | ltrimstr("sha256:")'
          )"
          printf '%s  %s\n' "${act_sha256}" "${act_archive}" | sha256sum -c -
          sudo tar -xzf "${act_archive}" -C /usr/local/bin act

      - name: Install documentation tooling
        run: |
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          uv tool install "mbake==${MBAKE_VERSION}"

      - name: Install Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check Docker runtime
        run: docker info

      - name: Run tests with act validation
        run: make test WITH_ACT=1
