name: Build Pure Python Wheel
description: Builds a pure Python wheel using UV and uploads it as an artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place built wheel
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    required: true
  upload-artefact:
    description: Whether to upload the wheel (disable for local smoke tests)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb
    - name: Build wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: uv build --wheel --out-dir "$OUT_DIR"
    - name: Upload wheel artefact
      if: inputs.upload-artefact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}/*.whl
