# Two configurations: one that must hold, and one that must keep failing.
#
# The second is what makes the exit status worth asserting. A run that reported
# only the first would pass whether or not the incident was still reproduced,
# and the stub answers the two differently only because the known-bad run
# retains a single assertion (D3).

[configurations.head]
min_states = 1
holds = ["S1", "BEventually"]

# The table is the whole frontmatter document, so the inner ``options`` is the
# mapping FizzBee reads; the real models declare theirs the same way. The bound
# is what ``--fixpoint`` doubles, so a configuration without one cannot be
# compared. The stub answers the declared bound with the recorded pass and the
# doubled bound with the recorded lasso: a deeper search finds the liveness
# violation the truncated run could not, which is the failure the end-to-end
# test needs in order to prove the evidence survives the exit.
[configurations.head.options.options]
max_actions = 8

[configurations.head.fairness]
F1 = "weak"

[configurations.incident-1]
min_states = 1
fails_as = { BEventually = "lasso" }
